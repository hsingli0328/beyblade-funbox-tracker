<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Beyblade X Funbox LINE 門市與抽選追蹤工具" />
  <title>Beyblade X｜Funbox 抽選追蹤</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-grid"></div>

  <header class="hero">
    <div class="hero__inner">
      <div>
        <p class="eyebrow">BEYBLADE X / FUNBOX</p>
        <h1>LINE 抽選追蹤器</h1>
        <p class="hero__copy">
          快速找北部／中部 Funbox 門市、開啟 LINE 官方帳號，並保留已開啟與收藏狀態。
        </p>
      </div>
      <div class="hero__badge">
        <span>V1</span>
        <strong>44 間門市</strong>
      </div>
    </div>
  </header>

  <main class="shell">
    <nav class="tabs" aria-label="主要功能">
      <button class="tab is-active" data-tab="draws">抽選追蹤</button>
      <button class="tab" data-tab="stores">LINE 門市</button>
    </nav>

    <section id="drawsPage" class="page">
      <div class="panel">
        <div class="panel__header">
          <div>
            <p class="section-kicker">MY WATCHLIST</p>
            <h2>想追的陀螺</h2>
          </div>
          <span id="watchCount" class="counter">0</span>
        </div>

        <form id="watchForm" class="watch-form">
          <input id="watchInput" type="text" autocomplete="off"
                 placeholder="輸入型號，例如 UX-19、CX-18" maxlength="40" />
          <button type="submit" class="btn btn--primary">加入追蹤</button>
        </form>
        <div id="watchList" class="chips"></div>
      </div>

      <div class="toolbar toolbar--draws">
        <label class="field">
          <span>區域</span>
          <select id="drawRegion">
            <option value="all">全部</option>
            <option value="北部">北部</option>
            <option value="中部">中部</option>
          </select>
        </label>
        <label class="field">
          <span>搜尋活動</span>
          <input id="drawSearch" type="search" placeholder="商品、門市、城市…" />
        </label>
        <label class="check">
          <input id="trackedOnly" type="checkbox" />
          <span>只看追蹤商品</span>
        </label>
      </div>

      <div id="drawSummary" class="summary-strip"></div>
      <div id="drawList" class="draw-list"></div>
    </section>

    <section id="storesPage" class="page" hidden>
      <div class="stats" id="storeStats"></div>

      <div class="toolbar">
        <div class="segmented" id="regionButtons" aria-label="區域篩選">
          <button class="segment is-active" data-region="all">全部</button>
          <button class="segment" data-region="北部">北部</button>
          <button class="segment" data-region="中部">中部</button>
        </div>

        <label class="field">
          <span>縣市</span>
          <select id="cityFilter">
            <option value="all">全部縣市</option>
          </select>
        </label>

        <label class="field field--grow">
          <span>搜尋門市</span>
          <input id="storeSearch" type="search" placeholder="例如：新竹、SOGO、LaLaport…" />
        </label>

        <label class="check">
          <input id="favoriteOnly" type="checkbox" />
          <span>只看收藏</span>
        </label>
      </div>

      <div id="storeResultMeta" class="result-meta"></div>
      <div id="storeGrid" class="store-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>
      非 Funbox 官方網站。門市名稱、粉專與 LINE 官方帳號 ID 依官方資料表整理；
      抽選活動請以各門市 LINE 官方公告為準。
    </p>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
